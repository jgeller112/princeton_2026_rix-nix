<svg width="1400" height="780" viewBox="0 0 1400 780" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<rect width="1400" height="780" fill="#FFFFFF"/>
<rect x="13.0" y="13.0" width="1374" height="754" rx="22" fill="#F6EFE2" stroke="#98002E" stroke-width="10"/>
<text x="700.0" y="72" text-anchor="middle" font-weight="bold" font-size="40" fill="#1F2937">Computational environment</text>
<text x="635.0" y="138" text-anchor="middle" font-size="30" font-weight="bold" fill="#1F2937">across space</text>
<text x="635.0" y="168" text-anchor="middle" font-size="21" fill="#4A5568">(spatial reproducibility)</text>
<text x="1135.0" y="138" text-anchor="middle" font-size="30" font-weight="bold" fill="#1F2937">across time</text>
<text x="1135.0" y="168" text-anchor="middle" font-size="21" fill="#4A5568">(temporal reproducibility)</text>
<text x="200" y="269.0" text-anchor="middle" font-size="27" font-weight="bold" fill="#1F2937">the environment builds</text>
<text x="200" y="301.0" text-anchor="middle" font-size="20" fill="#4A5568">(rebuildability)</text>
<rect x="400" y="190" width="470" height="170" rx="14" fill="#FFFFFF" stroke="#D5D9E0" stroke-width="2"/>
<text x="635.0" y="267.0" text-anchor="middle" font-size="28" fill="#1F2937">builds on another machine or</text>
<text x="635.0" y="303.0" text-anchor="middle" font-size="28" fill="#1F2937">OS, today</text>
<rect x="900" y="190" width="470" height="170" rx="14" fill="#FFFFFF" stroke="#D5D9E0" stroke-width="2"/>
<text x="1135.0" y="267.0" text-anchor="middle" font-size="28" fill="#1F2937">the same description still</text>
<text x="1135.0" y="303.0" text-anchor="middle" font-size="28" fill="#1F2937">builds years later</text>
<text x="200" y="459.0" text-anchor="middle" font-size="27" font-weight="bold" fill="#1F2937">the results are the same</text>
<text x="200" y="491.0" text-anchor="middle" font-size="20" fill="#4A5568">(functional reproducibility)</text>
<rect x="400" y="380" width="470" height="170" rx="14" fill="#FFFFFF" stroke="#D5D9E0" stroke-width="2"/>
<text x="635.0" y="457.0" text-anchor="middle" font-size="28" fill="#1F2937">same versions, same numbers,</text>
<text x="635.0" y="493.0" text-anchor="middle" font-size="28" fill="#1F2937">on another machine or OS</text>
<rect x="900" y="380" width="470" height="170" rx="14" fill="#FFFFFF" stroke="#D5D9E0" stroke-width="2"/>
<text x="1135.0" y="457.0" text-anchor="middle" font-size="28" fill="#1F2937">same versions, same numbers,</text>
<text x="1135.0" y="493.0" text-anchor="middle" font-size="28" fill="#1F2937">years later</text>
<text x="200" y="649.0" text-anchor="middle" font-size="27" font-weight="bold" fill="#1F2937">the bytes are the same</text>
<text x="200" y="681.0" text-anchor="middle" font-size="20" fill="#4A5568">(bitwise reproducibility)</text>
<rect x="400" y="570" width="470" height="170" rx="14" fill="#FFFFFF" stroke="#D5D9E0" stroke-width="2"/>
<text x="635.0" y="647.0" text-anchor="middle" font-size="28" fill="#1F2937">identical hashes on another</text>
<text x="635.0" y="683.0" text-anchor="middle" font-size="28" fill="#1F2937">machine</text>
<rect x="900" y="570" width="470" height="170" rx="14" fill="#FFFFFF" stroke="#D5D9E0" stroke-width="2"/>
<text x="1135.0" y="647.0" text-anchor="middle" font-size="28" fill="#1F2937">identical hashes, years</text>
<text x="1135.0" y="683.0" text-anchor="middle" font-size="28" fill="#1F2937">later</text>
</svg>