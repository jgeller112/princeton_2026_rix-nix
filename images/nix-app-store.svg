<svg width="420" height="760" viewBox="0 0 420 760" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <!-- phone body -->
  <rect x="20" y="10" width="380" height="740" rx="56" fill="#1A1A1A"/>
  <rect x="36" y="26" width="348" height="708" rx="42" fill="#FFFFFF"/>
  <rect x="160" y="40" width="100" height="22" rx="11" fill="#1A1A1A"/>

  <!-- store header -->
  <text x="60" y="112" font-size="30" font-weight="bold" fill="#1A1A1A">nixpkgs store</text>
  <rect x="60" y="130" width="300" height="46" rx="23" fill="#F4ECE0" stroke="#BC9B6A" stroke-width="2"/>
  <!-- pin -->
  <g transform="translate(80,140)">
    <circle cx="12" cy="10" r="8" fill="#98002E"/>
    <line x1="12" y1="18" x2="12" y2="28" stroke="#98002E" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="112" y="161" font-size="21" fill="#5C001C" font-weight="bold">Snapshot: 2026-08-24</text>

  <!-- app grid: 3 x 3 -->
  <g font-size="18" text-anchor="middle" fill="#1A1A1A">
    <!-- row 1 -->
    <rect x="60"  y="210" width="84" height="84" rx="20" fill="#98002E"/>
    <text x="102" y="266" font-size="40" font-weight="bold" fill="#FFFFFF">R</text>
    <text x="102" y="322">R</text>

    <rect x="168" y="210" width="84" height="84" rx="20" fill="#BC9B6A"/>
    <text x="210" y="262" font-size="24" font-weight="bold" fill="#1A1A1A">brms</text>
    <text x="210" y="322">brms</text>

    <rect x="276" y="210" width="84" height="84" rx="20" fill="#5C001C"/>
    <text x="318" y="264" font-size="30" font-weight="bold" fill="#FFFFFF">Q</text>
    <text x="318" y="322">Quarto</text>

    <!-- row 2 -->
    <rect x="60"  y="350" width="84" height="84" rx="20" fill="#BC9B6A"/>
    <text x="102" y="402" font-size="22" font-weight="bold" fill="#1A1A1A">Stan</text>
    <text x="102" y="462">CmdStan</text>

    <rect x="168" y="350" width="84" height="84" rx="20" fill="#98002E"/>
    <text x="210" y="402" font-size="22" font-weight="bold" fill="#FFFFFF">knitr</text>
    <text x="210" y="462">knitr</text>

    <rect x="276" y="350" width="84" height="84" rx="20" fill="#1A1A1A"/>
    <text x="318" y="402" font-size="20" font-weight="bold" fill="#FFFFFF">pandoc</text>
    <text x="318" y="462">pandoc</text>

    <!-- row 3 -->
    <rect x="60"  y="490" width="84" height="84" rx="20" fill="#5C001C"/>
    <text x="102" y="542" font-size="22" font-weight="bold" fill="#FFFFFF">Py</text>
    <text x="102" y="602">Python</text>

    <rect x="168" y="490" width="84" height="84" rx="20" fill="#1A1A1A"/>
    <text x="210" y="542" font-size="20" font-weight="bold" fill="#FFFFFF">BLAS</text>
    <text x="210" y="602">BLAS</text>

    <rect x="276" y="490" width="84" height="84" rx="20" fill="#D9D9D9"/>
    <text x="318" y="544" font-size="28" font-weight="bold" fill="#1A1A1A">+</text>
    <text x="318" y="602">120k more</text>
  </g>

  <!-- footer: no auto-updates -->
  <rect x="60" y="640" width="300" height="50" rx="12" fill="#FFFFFF" stroke="#98002E" stroke-width="3"/>
  <text x="210" y="672" font-size="20" font-weight="bold" fill="#98002E" text-anchor="middle">Auto-update: OFF</text>
</svg>
