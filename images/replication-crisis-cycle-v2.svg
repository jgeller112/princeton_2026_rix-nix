<svg width="1050" height="950" viewBox="0 0 1050 950" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9 Z" fill="#3B6FA6"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9 Z" fill="#B23A3A"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1050" height="950" fill="#FFFFFF"/>

  <text x="525" y="32" text-anchor="middle" font-size="22" font-weight="700" fill="#1A1A1A">The research cycle and where it breaks down</text>

  <!-- ================= CYCLE ARROWS (edge-to-edge, symmetric bows) ================= -->
  <g fill="none" stroke="#3B6FA6" stroke-width="6" stroke-linecap="round">
    <path d="M 470 219 Q 500 158 530 219" marker-end="url(#arrowBlue)"/>            <!-- Publish -> Specify -->
    <path d="M 700 283 Q 762 328 645 418" marker-end="url(#arrowBlue)"/>            <!-- Specify -> Design -->
    <path d="M 645 482 Q 762 578 700 617" marker-end="url(#arrowBlue)"/>            <!-- Design -> Collect -->
    <path d="M 530 681 Q 500 742 470 681" marker-end="url(#arrowBlue)"/>            <!-- Collect -> Analyze -->
    <path d="M 300 617 Q 238 578 355 482" marker-end="url(#arrowBlue)"/>            <!-- Analyze -> Interpret -->
    <path d="M 355 418 Q 238 328 300 283" marker-end="url(#arrowBlue)"/>            <!-- Interpret -> Publish -->
  </g>

  <!-- ================= RED HARKing ARROW ================= -->
  <line x1="357" y1="416" x2="528" y2="285" stroke="#B23A3A" stroke-width="3.5" marker-end="url(#arrowRed)"/>

  <!-- ================= HARKing callout (center) ================= -->
  <g>
    <rect x="342" y="305" width="200" height="90" rx="6" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"/>
    <text x="442" y="329" text-anchor="middle" font-size="16" font-weight="700" fill="#B23A3A">HARKing</text>
    <text x="442" y="349" text-anchor="middle" font-size="13" fill="#1A1A1A">~50–90% prevalence</text>
    <text x="442" y="368" text-anchor="middle" font-size="11" fill="#767676">Kerr (1998); John et al. (2012)</text>
  </g>

  <!-- ================= CYCLE NODES ================= -->
  <g>
    <rect x="300" y="219" width="170" height="64" rx="8" fill="#EAF1FA" stroke="#3B6FA6" stroke-width="1.5"/>
    <text x="385" y="257" text-anchor="middle" font-size="16" font-weight="700" fill="#1A1A1A">Publish experiment</text>
  </g>
  <g>
    <rect x="530" y="219" width="170" height="64" rx="8" fill="#EAF1FA" stroke="#3B6FA6" stroke-width="1.5"/>
    <text x="615" y="245" text-anchor="middle" font-size="16" font-weight="700" fill="#1A1A1A">Specify</text>
    <text x="615" y="265" text-anchor="middle" font-size="16" font-weight="700" fill="#1A1A1A">hypotheses</text>
  </g>
  <g>
    <rect x="645" y="418" width="170" height="64" rx="8" fill="#EAF1FA" stroke="#3B6FA6" stroke-width="1.5"/>
    <text x="730" y="444" text-anchor="middle" font-size="16" font-weight="700" fill="#1A1A1A">Design</text>
    <text x="730" y="464" text-anchor="middle" font-size="16" font-weight="700" fill="#1A1A1A">study</text>
  </g>
  <g>
    <rect x="530" y="617" width="170" height="64" rx="8" fill="#EAF1FA" stroke="#3B6FA6" stroke-width="1.5"/>
    <text x="615" y="643" text-anchor="middle" font-size="16" font-weight="700" fill="#1A1A1A">Collect</text>
    <text x="615" y="663" text-anchor="middle" font-size="16" font-weight="700" fill="#1A1A1A">data</text>
  </g>
  <g>
    <rect x="300" y="617" width="170" height="64" rx="8" fill="#EAF1FA" stroke="#3B6FA6" stroke-width="1.5"/>
    <text x="385" y="643" text-anchor="middle" font-size="16" font-weight="700" fill="#1A1A1A">Analyze</text>
    <text x="385" y="663" text-anchor="middle" font-size="16" font-weight="700" fill="#1A1A1A">data</text>
  </g>
  <g>
    <rect x="185" y="418" width="170" height="64" rx="8" fill="#EAF1FA" stroke="#3B6FA6" stroke-width="1.5"/>
    <text x="270" y="444" text-anchor="middle" font-size="16" font-weight="700" fill="#1A1A1A">Interpret</text>
    <text x="270" y="464" text-anchor="middle" font-size="16" font-weight="700" fill="#1A1A1A">data</text>
  </g>

  <!-- ================= ANNOTATION CALLOUTS ================= -->

  <!-- Publication bias -->
  <g>
    <rect x="20" y="40" width="290" height="120" rx="6" fill="#FFFFFF" stroke="#D9D9D9" stroke-width="1"/>
    <text x="36" y="66" font-size="16" font-weight="700" fill="#B23A3A">Publication bias &amp;</text>
    <text x="36" y="86" font-size="16" font-weight="700" fill="#B23A3A">lack of data sharing</text>
    <text x="36" y="110" font-size="14" fill="#1A1A1A">~92% positive results;</text>
    <text x="36" y="128" font-size="14" fill="#1A1A1A">~70% data unavailable</text>
    <text x="36" y="148" font-size="11" fill="#909090">Fanelli (2010); Wicherts et al. (2006)</text>
  </g>
  <line x1="230" y1="160" x2="310" y2="215" stroke="#9A9A9A" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Lack of replication -->
  <g>
    <rect x="760" y="40" width="270" height="105" rx="6" fill="#FFFFFF" stroke="#D9D9D9" stroke-width="1"/>
    <text x="776" y="66" font-size="16" font-weight="700" fill="#B23A3A">Lack of replication</text>
    <text x="776" y="90" font-size="14" fill="#1A1A1A">About 1 in 1000 papers</text>
    <text x="776" y="108" font-size="14" fill="#1A1A1A">is a direct replication</text>
    <text x="776" y="130" font-size="11" fill="#909090">Makel et al. (2012)</text>
  </g>
  <line x1="820" y1="145" x2="700" y2="240" stroke="#9A9A9A" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Low statistical power -->
  <g>
    <rect x="800" y="700" width="290" height="120" rx="6" fill="#FFFFFF" stroke="#D9D9D9" stroke-width="1"/>
    <text x="816" y="726" font-size="16" font-weight="700" fill="#B23A3A">Low statistical power</text>
    <text x="816" y="750" font-size="14" fill="#1A1A1A">~50% chance of detecting</text>
    <text x="816" y="768" font-size="14" fill="#1A1A1A">a medium-sized effect</text>
    <text x="816" y="790" font-size="11" fill="#909090">Cohen (1962); Sedlmeier &amp;</text>
    <text x="816" y="806" font-size="11" fill="#909090">Gigerenzer (1989); Bezeau &amp; Graves (2001)</text>
  </g>
  <line x1="870" y1="700" x2="800" y2="490" stroke="#9A9A9A" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- P-hacking -->
  <g>
    <rect x="20" y="720" width="260" height="105" rx="6" fill="#FFFFFF" stroke="#D9D9D9" stroke-width="1"/>
    <text x="36" y="746" font-size="16" font-weight="700" fill="#B23A3A">P-hacking</text>
    <text x="36" y="770" font-size="14" fill="#1A1A1A">~50–100% prevalence</text>
    <text x="36" y="792" font-size="11" fill="#909090">John et al. (2012)</text>
  </g>
  <line x1="230" y1="720" x2="320" y2="630" stroke="#9A9A9A" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- ================= LEGEND ================= -->
  <g>
    <line x1="740" y1="880" x2="770" y2="880" stroke="#3B6FA6" stroke-width="6" stroke-linecap="round"/>
    <text x="780" y="885" font-size="13" fill="#1A1A1A">Standard research cycle</text>
    <line x1="740" y1="905" x2="770" y2="905" stroke="#B23A3A" stroke-width="3.5"/>
    <text x="780" y="910" font-size="13" fill="#1A1A1A">Questionable shortcut (e.g., HARKing)</text>
  </g>
</svg>
