<script>
// Add the "works on my machine" badge to the title slide
document.addEventListener("DOMContentLoaded", function () {
  var slide = document.getElementById("title-slide");
  if (!slide) return;
  var img = document.createElement("img");
  img.src = "images/works-on-my-machine-x.svg";
  img.alt = "Works on my machine badge, crossed out";
  img.className = "title-badge";
  slide.appendChild(img);
  var ci = document.createElement("img");
  ci.src = "images/ci-badge-failing.svg";
  ci.alt = "CI badge: works on my machine, failing";
  ci.className = "title-ci-badge";
  slide.appendChild(ci);
});
</script>
